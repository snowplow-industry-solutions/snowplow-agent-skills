version: '3.8'

services:
  micro:
    image: snowplow/snowplow-micro:4.2.0
    container_name: snowplow-micro
    ports:
      - "9090:9090"
    env_file:
      - .env
    environment:
      - MICRO_PORT=9090
      - MICRO_IGLU_REGISTRY_URL=https://com-snplow-eng-aws-dev.iglu.snplow.net/api
      - MICRO_IGLU_API_KEY=${SNOWPLOW_IGLU_API_KEY}
    restart: unless-stopped
